<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Babylon Diffraction Grating</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #info {
            position: fixed;
            left: 20px;
            top: 20px;
            color: rgba(255, 255, 255, 0.75);
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<div id="info">
    DIFFRACTION GRATING<br>
    drag = orbit<br>
    wheel = zoom
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="./diffraction.js"></script>

</body>
</html>
